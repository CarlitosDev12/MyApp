plugins {
    id 'com.android.application'
}

android {
    namespace 'com.carlos.myapp' // Cambia esto por el nombre de tu paquete si es diferente
    compileSdk 34 // O la versión de SDK que estés usando en tu GitHub Actions

    defaultConfig {
        applicationId "com.carlos.myapp"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.4.0-beta.3"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        
        externalNativeBuild {
            cmake {
                cppFlags ""
                arguments "-DANDROID_STL=c++_shared"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1' // O la versión de CMake que use tu entorno de compilación
        }
    }
}
