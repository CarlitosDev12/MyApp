plugins {
    id 'com.android.application'
}

android {
    namespace "com.carlos.myapp"
    compileSdk 33

    defaultConfig {
        applicationId "com.carlos.myapp"
        minSdk 21
        targetSdk 33
        versionCode 2
        versionName "1.4.0-beta.3"

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }
}
